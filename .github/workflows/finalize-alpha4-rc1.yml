name: Finalize alpha.4 RC1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-alpha4-rc1.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove one-use publisher and retarget release tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hoop Land Extended"
          git config user.email "332699421+HoopLandExtended@users.noreply.github.com"
          git rm -r \
            .github/release-alpha4-rc1 \
            .github/workflows/publish-alpha4-rc1.yml \
            .github/workflows/finalize-alpha4-rc1.yml
          git commit -m "Remove one-use alpha.4 RC1 publisher"
          git push origin HEAD:main
          git tag -f v0.2.0-alpha.4-rc.1 HEAD
          git push origin refs/tags/v0.2.0-alpha.4-rc.1 --force
