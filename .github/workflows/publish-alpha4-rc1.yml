name: Publish alpha.4 RC1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-alpha4-rc1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat .github/release-alpha4-rc1/asset.part-* > dist/HoopLandExtended-0.2.0-alpha.4-rc.1-win-x64.zip
          echo "cb2f7c6104e0182d98e8effe646ab90e89629dc17c306cb90ab50e2e1aaf466a  dist/HoopLandExtended-0.2.0-alpha.4-rc.1-win-x64.zip" | sha256sum -c -

      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.2.0-alpha.4-rc.1 \
            dist/HoopLandExtended-0.2.0-alpha.4-rc.1-win-x64.zip \
            --target "$GITHUB_SHA" \
            --title "Hoop Land Extended v0.2.0-alpha.4-rc.1" \
            --notes-file .github/release-alpha4-rc1/RELEASE-BODY.md \
            --prerelease
