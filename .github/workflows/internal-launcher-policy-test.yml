name: Internal launcher integrity policy test

on:
  push:
    paths:
      - '.github/workflows/internal-launcher-policy-test.yml'
      - '.github/internal/launcher-policy.part1'
      - '.github/internal/launcher-policy.part2'
      - '.github/internal/launcher-policy.part3'
      - '.github/internal/launcher-policy.part4'
      - '.github/internal/launcher-policy.part5'

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reconstruct exact launcher patch ZIP
        shell: powershell
        run: |
          Set-StrictMode -Version 2.0
          $expectedLengths=@(3000,3000,3000,3000,1144)
          $expectedHashes=@(
            'e064d3470792a7094353c50ed07de4fe773774305f3536bacf1dc8dd9fce5f9b',
            '4ab35ba4f4f4d7acd41e9d23c85a54bab9ffcfe1fd1229fa4f63be43c6914352',
            '32fadb21b34a0430f8aa013d79d35ff75d92d72243ffad06508393065d89fd7b',
            '9044230c61468a5c726d4b8090c6d7dfd354cf8dffeeff41c808aecd7aada2a8',
            '7230e7104de2013663601e57e24c80029c0910c6fc735f66b1aa265b4913d4d3'
          )
          $parts=@()
          for ($i=1; $i -le 5; $i++) {
            $path=".github/internal/launcher-policy.part$i"
            $value=[IO.File]::ReadAllText((Resolve-Path $path)).Trim()
            if ($value.Length -ne $expectedLengths[$i-1]) { throw "Part $i length mismatch: $($value.Length)" }
            $bytes=[Text.Encoding]::ASCII.GetBytes($value)
            $sha=[BitConverter]::ToString((New-Object Security.Cryptography.SHA256Managed).ComputeHash($bytes)).Replace('-','').ToLowerInvariant()
            if ($sha -ne $expectedHashes[$i-1]) { throw "Part $i hash mismatch: $sha" }
            $parts += $value
          }
          $encoded=$parts -join ''
          if ($encoded.Length -ne 13144) { throw "Combined base64 length mismatch: $($encoded.Length)" }
          $zipBytes=[Convert]::FromBase64String($encoded)
          $zip=Join-Path $env:RUNNER_TEMP 'HLE-Launcher-Integrity-Policy-Update.zip'
          [IO.File]::WriteAllBytes($zip,$zipBytes)
          $sha=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '028dc8a50882e34b305f16e1a93d6b555db87ddfde010285547b1e1305754ebe') { throw "ZIP SHA mismatch: $sha" }
          $size=(Get-Item -LiteralPath $zip).Length
          if ($size -ne 9858) { throw "ZIP size mismatch: $size" }
          Write-Host "PASS: exact launcher patch ZIP reconstructed ($sha)"

      - name: Extract and syntax-check launcher patch
        shell: powershell
        run: |
          Set-StrictMode -Version 2.0
          $zip=Join-Path $env:RUNNER_TEMP 'HLE-Launcher-Integrity-Policy-Update.zip'
          $dest=Join-Path $env:RUNNER_TEMP 'launcher-patch'
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          $required=@(
            'APPLY-LAUNCHER-PATCH.cmd',
            'LauncherPatch/Apply.ps1',
            'LauncherPatch/2-PLAY-HLE.cmd',
            'LauncherPatch/scripts/Common.ps1',
            'LauncherPatch/scripts/Play.ps1',
            'LauncherPatch/PATCH-NOTES.txt'
          )
          foreach ($rel in $required) {
            $p=Join-Path $dest $rel
            if (!(Test-Path -LiteralPath $p -PathType Leaf)) { throw "Missing patch file: $rel" }
          }
          foreach ($rel in @('LauncherPatch/Apply.ps1','LauncherPatch/scripts/Common.ps1','LauncherPatch/scripts/Play.ps1')) {
            $p=Join-Path $dest $rel
            [void][ScriptBlock]::Create([IO.File]::ReadAllText($p))
          }
          $cmd=[IO.File]::ReadAllText((Join-Path $dest 'LauncherPatch/2-PLAY-HLE.cmd'))
          if ($cmd -notmatch '--force' -or $cmd -notmatch '-Force') { throw '2-PLAY-HLE.cmd does not expose --force.' }
          Write-Host 'PASS: patch contents and Windows PowerShell syntax validated'

      - name: Verify drop-in patch installer
        shell: powershell
        run: |
          Set-StrictMode -Version 2.0
          $patchRoot=Join-Path $env:RUNNER_TEMP 'launcher-patch/LauncherPatch'
          $root=Join-Path $env:RUNNER_TEMP 'apply-target'
          New-Item -ItemType Directory -Path (Join-Path $root 'scripts') -Force | Out-Null

          function Write-Utf8([string]$Path,[string]$Text) {
            New-Item -ItemType Directory -Path (Split-Path $Path -Parent) -Force | Out-Null
            [IO.File]::WriteAllText($Path,$Text,(New-Object Text.UTF8Encoding($false)))
          }
          function Sha([string]$Path) { (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant() }

          Write-Utf8 (Join-Path $root '2-PLAY-HLE.cmd') '@echo old'
          Write-Utf8 (Join-Path $root 'scripts/Common.ps1') "Write-Host 'old common'"
          Write-Utf8 (Join-Path $root 'scripts/Play.ps1') "Write-Host 'old play'"
          Write-Utf8 (Join-Path $root 'installed.json') '{"sentinel":"do-not-touch"}'

          $files=@()
          foreach ($rel in @('2-PLAY-HLE.cmd','scripts/Common.ps1','scripts/Play.ps1')) {
            $files += [pscustomobject]@{Path=$rel;Sha256=(Sha (Join-Path $root $rel))}
          }
          $release=[pscustomobject]@{Version='synthetic';Files=$files}
          [IO.File]::WriteAllText((Join-Path $root 'release.json'),($release|ConvertTo-Json -Depth 10),(New-Object Text.UTF8Encoding($false)))
          $installedBefore=[IO.File]::ReadAllText((Join-Path $root 'installed.json'))

          & (Join-Path $patchRoot 'Apply.ps1') -PackageRoot $root

          $backups=@(Get-ChildItem -LiteralPath $root -Directory -Filter 'LauncherPatchBackup-*')
          if ($backups.Count -ne 1) { throw "Expected one launcher backup, found $($backups.Count)." }
          foreach ($rel in @('2-PLAY-HLE.cmd','scripts/Common.ps1','scripts/Play.ps1')) {
            $target=Join-Path $root $rel
            $source=Join-Path $patchRoot $rel
            if ((Sha $target) -ne (Sha $source)) { throw "Patched file mismatch: $rel" }
            if (!(Test-Path -LiteralPath (Join-Path $backups[0].FullName $rel) -PathType Leaf)) { throw "Backup missing: $rel" }
          }
          if ([IO.File]::ReadAllText((Join-Path $root 'installed.json')) -ne $installedBefore) { throw 'Apply.ps1 modified installed.json.' }
          if (!(Test-Path -LiteralPath (Join-Path $root 'LAUNCHER-POLICY-NOTES.txt') -PathType Leaf)) { throw 'Launcher policy notes were not installed.' }

          $updated=Get-Content -LiteralPath (Join-Path $root 'release.json') -Raw | ConvertFrom-Json
          foreach ($rel in @('2-PLAY-HLE.cmd','scripts/Common.ps1','scripts/Play.ps1')) {
            $entry=@($updated.Files | Where-Object { ([string]$_.Path).Replace('\','/') -ieq $rel } | Select-Object -First 1)
            if ($entry.Count -ne 1) { throw "Updated manifest missing $rel" }
            if (([string]$entry[0].Sha256).ToLowerInvariant() -ne (Sha (Join-Path $root $rel))) { throw "Updated manifest hash mismatch: $rel" }
          }
          Write-Host 'PASS: drop-in patch updates launcher + manifest, backs up originals, and leaves installed.json untouched'

      - name: Exercise integrity severity policy
        shell: powershell
        run: |
          Set-StrictMode -Version 2.0
          $patchRoot=Join-Path $env:RUNNER_TEMP 'launcher-patch/LauncherPatch'
          $root=Join-Path $env:RUNNER_TEMP 'policy-test'
          New-Item -ItemType Directory -Path (Join-Path $root 'scripts') -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $patchRoot '2-PLAY-HLE.cmd') -Destination (Join-Path $root '2-PLAY-HLE.cmd')
          Copy-Item -LiteralPath (Join-Path $patchRoot 'scripts/Common.ps1') -Destination (Join-Path $root 'scripts/Common.ps1')
          Copy-Item -LiteralPath (Join-Path $patchRoot 'scripts/Play.ps1') -Destination (Join-Path $root 'scripts/Play.ps1')

          function Write-Utf8([string]$Path,[string]$Text) {
            New-Item -ItemType Directory -Path (Split-Path $Path -Parent) -Force | Out-Null
            [IO.File]::WriteAllText($Path,$Text,(New-Object Text.UTF8Encoding($false)))
          }
          function Sha([string]$Path) { (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant() }
          function Write-ReleaseManifest {
            $files=@()
            foreach ($rel in @('2-PLAY-HLE.cmd','scripts/Common.ps1','scripts/Play.ps1')) {
              $files += [pscustomobject]@{Path=$rel;Sha256=(Sha (Join-Path $root $rel))}
            }
            $obj=[pscustomobject]@{Version='synthetic';Files=$files}
            [IO.File]::WriteAllText((Join-Path $root 'release.json'),($obj|ConvertTo-Json -Depth 10),(New-Object Text.UTF8Encoding($false)))
          }
          function Write-Receipt {
            $files=@()
            foreach ($rel in @(
              'winhttp.dll',
              'BepInEx/core/BepInEx.Unity.IL2CPP.dll',
              'dotnet/coreclr.dll',
              'BepInEx/plugins/HoopLandExpanded/HoopLandExpanded.dll',
              'BepInEx/plugins/HoopLandExpanded/HoopLandExpanded.CareerHost.dll',
              'BepInEx/plugins/HoopLandExpanded/HoopLandExpanded.Finance.dll',
              'BepInEx/plugins/HoopLandExpanded/HoopLandExpanded.Finance.NativeImport.dll'
            )) {
              $files += [pscustomobject]@{Path=$rel;Sha256=(Sha (Join-Path $root ('Game/'+$rel)))}
            }
            $obj=[pscustomobject]@{Version='synthetic';Files=$files}
            [IO.File]::WriteAllText((Join-Path $root 'installed.json'),($obj|ConvertTo-Json -Depth 10),(New-Object Text.UTF8Encoding($false)))
          }
          function Write-Compatibility {
            $baseline=[pscustomobject]@{Files=@([pscustomobject]@{Path='GameAssembly.dll';Sha256=(Sha (Join-Path $root 'Game/GameAssembly.dll'))})}
            $deps=[pscustomobject]@{Files=@([pscustomobject]@{Path='UnityPlayer.dll';Sha256=(Sha (Join-Path $root 'Game/UnityPlayer.dll'))})}
            New-Item -ItemType Directory -Path (Join-Path $root 'compatibility') -Force | Out-Null
            [IO.File]::WriteAllText((Join-Path $root 'compatibility/baseline.json'),($baseline|ConvertTo-Json -Depth 10),(New-Object Text.UTF8Encoding($false)))
            [IO.File]::WriteAllText((Join-Path $root 'compatibility/native-dependencies.json'),($deps|ConvertTo-Json -Depth 10),(New-Object Text.UTF8Encoding($false)))
          }
          function Write-GoodConfig {
            Write-Utf8 (Join-Path $root 'Game/BepInEx/config/org.hooplandexpanded.bootstrap.cfg') "[Core]`r`nEnabled = true`r`n`r`n[Development]`r`nAutomaticEnrollment = true`r`nMigratedModules = true`r`nContractDiagnostics = false`r`nSoftCapQualification = false`r`n"
          }
          function Write-GoodDoorstop {
            Write-Utf8 (Join-Path $root 'Game/doorstop_config.ini') "[General]`r`nenabled = true`r`ntarget_assembly = BepInEx\core\BepInEx.Unity.IL2CPP.dll`r`nignore_disable_switch = false`r`n"
          }
          function Assert-Issue($Issues,[string]$Severity,[string]$Code) {
            $matches=@($Issues | Where-Object { $_.Severity -eq $Severity -and $_.Code -eq $Code })
            if ($matches.Count -lt 1) { throw "Expected $Severity/$Code. Got: "+(($Issues|ForEach-Object{"$($_.Severity)/$($_.Code)"}) -join ', ') }
          }
          function Assert-NoSeverity($Issues,[string]$Severity) {
            if (@($Issues|Where-Object{$_.Severity -eq $Severity}).Count -gt 0) { throw "Unexpected severity $Severity." }
          }

          # Build clean synthetic install.
          Write-Utf8 (Join-Path $root 'Game/Hoop Land.exe') 'exe'
          Write-Utf8 (Join-Path $root 'Game/GameAssembly.dll') 'native-game'
          Write-Utf8 (Join-Path $root 'Game/UnityPlayer.dll') 'unity'
          Write-Utf8 (Join-Path $root 'Game/winhttp.dll') 'doorstop'
          Write-Utf8 (Join-Path $root 'Game/BepInEx/core/BepInEx.Unity.IL2CPP.dll') 'loader'
          Write-Utf8 (Join-Path $root 'Game/dotnet/coreclr.dll') 'runtime'
          Write-Utf8 (Join-Path $root 'Game/BepInEx/plugins/HoopLandExpanded/HoopLandExpanded.dll') 'hle-main'
          Write-Utf8 (Join-Path $root 'Game/BepInEx/plugins/HoopLandExpanded/HoopLandExpanded.CareerHost.dll') 'careerhost'
          Write-Utf8 (Join-Path $root 'Game/BepInEx/plugins/HoopLandExpanded/HoopLandExpanded.Finance.dll') 'finance'
          Write-Utf8 (Join-Path $root 'Game/BepInEx/plugins/HoopLandExpanded/HoopLandExpanded.Finance.NativeImport.dll') 'finance-native'
          Write-GoodConfig
          Write-GoodDoorstop
          Write-ReleaseManifest
          Write-Receipt
          Write-Compatibility

          . (Join-Path $root 'scripts/Common.ps1')

          $issues=@(Get-HleLaunchIntegrityIssues)
          if ($issues.Count -ne 0) { throw "Clean install produced issues: "+(($issues|ForEach-Object{"$($_.Severity)/$($_.Code)"}) -join ', ') }
          Write-Host 'PASS: clean install has no launch integrity issues'

          # Intentional HLE DLL replacement => warning, and strict legacy/setup path still rejects it.
          Write-Utf8 (Join-Path $root 'Game/BepInEx/plugins/HoopLandExpanded/HoopLandExpanded.dll') 'hle-development-build'
          $issues=@(Get-HleLaunchIntegrityIssues)
          Assert-Issue $issues 'Warning' 'HleRuntimeChanged'
          Assert-NoSeverity $issues 'Fatal'
          Assert-NoSeverity $issues 'StrongWarning'
          $strictThrew=$false
          try { Assert-Installed } catch { $strictThrew=$true }
          if (!$strictThrew) { throw 'Assert-Installed did not reject changed HLE runtime.' }
          Write-Host 'PASS: changed HLE runtime is launch-warning-only while strict validation still rejects it'
          Write-Utf8 (Join-Path $root 'Game/BepInEx/plugins/HoopLandExpanded/HoopLandExpanded.dll') 'hle-main'

          # Required installed DLL missing => fatal.
          Remove-Item -LiteralPath (Join-Path $root 'Game/BepInEx/plugins/HoopLandExpanded/HoopLandExpanded.dll') -Force
          $issues=@(Get-HleLaunchIntegrityIssues)
          Assert-Issue $issues 'Fatal' 'InstalledFileMissing'
          Write-Host 'PASS: missing installed runtime remains fatal'
          Write-Utf8 (Join-Path $root 'Game/BepInEx/plugins/HoopLandExpanded/HoopLandExpanded.dll') 'hle-main'

          # Native game build mismatch => strong warning, not normal one-click override.
          Write-Utf8 (Join-Path $root 'Game/GameAssembly.dll') 'native-game-changed'
          $issues=@(Get-HleLaunchIntegrityIssues)
          Assert-Issue $issues 'StrongWarning' 'UnsupportedGameBuild'
          Write-Host 'PASS: changed native game build is a strong warning'
          Write-Utf8 (Join-Path $root 'Game/GameAssembly.dll') 'native-game'

          # Extra plugin => normal warning.
          Write-Utf8 (Join-Path $root 'Game/BepInEx/plugins/ExtraTest.dll') 'extra'
          $issues=@(Get-HleLaunchIntegrityIssues)
          Assert-Issue $issues 'Warning' 'UnexpectedPluginCount'
          Write-Host 'PASS: extra plugin produces compatibility warning'
          Remove-Item -LiteralPath (Join-Path $root 'Game/BepInEx/plugins/ExtraTest.dll') -Force

          # Loader target mismatch => fatal.
          Write-Utf8 (Join-Path $root 'Game/doorstop_config.ini') "[General]`r`nenabled = true`r`ntarget_assembly = wrong.dll`r`nignore_disable_switch = false`r`n"
          $issues=@(Get-HleLaunchIntegrityIssues)
          Assert-Issue $issues 'Fatal' 'LoaderTargetChanged'
          Write-Host 'PASS: changed loader target remains fatal'
          Write-GoodDoorstop

          # Disable-switch override => strong warning and vanilla bypass cannot be guaranteed.
          Write-Utf8 (Join-Path $root 'Game/doorstop_config.ini') "[General]`r`nenabled = true`r`ntarget_assembly = BepInEx\core\BepInEx.Unity.IL2CPP.dll`r`nignore_disable_switch = true`r`n"
          $issues=@(Get-HleLaunchIntegrityIssues)
          Assert-Issue $issues 'StrongWarning' 'LoaderDisableSwitchIgnored'
          if (Test-HleVanillaBypassSafe) { throw 'Vanilla bypass incorrectly reported safe.' }
          Write-Host 'PASS: unsafe disable-switch configuration blocks guaranteed vanilla bypass'
          Write-GoodDoorstop

          # Private test setting => strong warning.
          Write-Utf8 (Join-Path $root 'Game/BepInEx/config/org.hooplandexpanded.bootstrap.cfg') "[Core]`r`nEnabled = true`r`n`r`n[Development]`r`nAutomaticEnrollment = true`r`nMigratedModules = true`r`nContractDiagnostics = true`r`nSoftCapQualification = false`r`n"
          $issues=@(Get-HleLaunchIntegrityIssues)
          Assert-Issue $issues 'StrongWarning' 'PrivateTestSettingEnabled'
          Write-Host 'PASS: private test flags produce strong warning'
          Write-GoodConfig

          # Package operational file changed => warning.
          Write-Utf8 (Join-Path $root '2-PLAY-HLE.cmd') '@echo modified'
          $issues=@(Get-HleLaunchIntegrityIssues)
          Assert-Issue $issues 'Warning' 'PackageFileChanged'
          Write-Host 'PASS: changed packaged launcher file produces warning'
          Copy-Item -LiteralPath (Join-Path $patchRoot '2-PLAY-HLE.cmd') -Destination (Join-Path $root '2-PLAY-HLE.cmd') -Force

          # Logging includes decision and expected/actual evidence.
          Write-Utf8 (Join-Path $root 'Game/BepInEx/plugins/HoopLandExpanded/HoopLandExpanded.dll') 'hle-development-build'
          $issues=@(Get-HleLaunchIntegrityIssues)
          Write-HleIntegrityLog $issues 'ci-continue-hle'
          $log=Get-Content -LiteralPath (Join-Path $root 'launcher-integrity.log') -Raw
          if ($log -notmatch 'decision=ci-continue-hle' -or $log -notmatch 'HleRuntimeChanged' -or $log -notmatch 'expected=' -or $log -notmatch 'actual=') {
            throw 'Integrity log did not retain warning evidence.'
          }
          Write-Host 'PASS: override decision and hash evidence are logged'

      - name: Verify launcher presentation and policy split
        shell: powershell
        run: |
          Set-StrictMode -Version 2.0
          $root=Join-Path $env:RUNNER_TEMP 'launcher-patch/LauncherPatch'
          $play=[IO.File]::ReadAllText((Join-Path $root 'scripts/Play.ps1'))
          $common=[IO.File]::ReadAllText((Join-Path $root 'scripts/Common.ps1'))
          if ($play -notmatch '\[1\] Continue with HLE' -or $play -notmatch '\[2\] Exit \(default\)' -or $play -notmatch '\[3\] Launch without HLE') { throw 'Warning choice UI missing.' }
          if ($play -notmatch '2-PLAY-HLE\.cmd --force') { throw 'Strong-warning --force guidance missing.' }
          if ($common -notmatch 'function Assert-Installed' -or $common -notmatch 'function Get-HleLaunchIntegrityIssues') { throw 'Strict/setup and launch-policy paths are not both present.' }
          Write-Host 'PASS: launcher exposes Continue/Exit/Vanilla and keeps separate strict setup validation'

      - uses: actions/upload-artifact@v7
        with:
          name: launcher-integrity-policy-update
          path: ${{ runner.temp }}\HLE-Launcher-Integrity-Policy-Update.zip
          retention-days: 1
