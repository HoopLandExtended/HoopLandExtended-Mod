name: Internal Player Upgrades component probe

on:
  push:
    paths:
      - '.github/workflows/internal-player-upgrades-components-probe.yml'
      - '.github/internal/player-upgrades-components-probe.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Install ILSpy
        run: dotnet tool install ilspycmd --tool-path .tools
      - name: Recover alpha.3 source and dependencies
        run: |
          set -euo pipefail
          curl -L --fail -o hle.zip "https://github.com/HoopLandExtended/HoopLandExtended-Mod/releases/download/v0.2.0-alpha.3/HoopLandExtended-0.2.0-alpha.3-win-x64.zip"
          unzip -q hle.zip -d pkg
          mkdir -p src/Main
          ./.tools/ilspycmd -p -o src/Main pkg/HoopLandExtended-0.2.0-alpha.3/payload/HoopLandExpanded.dll
          curl -L --fail -o bep.zip "https://builds.bepinex.dev/projects/bepinex_be/788/BepInEx-Unity.IL2CPP-win-x64-6.0.0-be.788%2B5b766a3.zip"
          curl -L --fail -o unity.zip "https://unity.bepinex.dev/libraries/2022.3.62.zip"
          mkdir -p refs/bep refs/unity
          unzip -q bep.zip -d refs/bep
          unzip -q unity.zip -d refs/unity
      - name: Normalize recovered source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("src/Main/HoopLandExpanded.csproj")
          s=p.read_text()
          s=s.replace("<LangVersion>14.0</LangVersion>","<LangVersion>12.0</LangVersion>")
          s=s.replace('<Reference Include="0Harmony" />','<Reference Include="0Harmony"><HintPath>../../refs/bep/BepInEx/core/0Harmony.dll</HintPath></Reference>')
          s=s.replace('<Reference Include="UnityEngine.CoreModule" />','<Reference Include="UnityEngine.CoreModule"><HintPath>../../refs/unity/UnityEngine.CoreModule.dll</HintPath></Reference>')
          s=s.replace('<Reference Include="Il2CppInterop.Runtime" />','<Reference Include="Il2CppInterop.Runtime"><HintPath>../../refs/bep/BepInEx/core/Il2CppInterop.Runtime.dll</HintPath></Reference>')
          s=s.replace('<Reference Include="BepInEx.Core" />','<Reference Include="BepInEx.Core"><HintPath>../../refs/bep/BepInEx/core/BepInEx.Core.dll</HintPath></Reference>')
          s=s.replace('<Reference Include="BepInEx.Unity.IL2CPP" />','<Reference Include="BepInEx.Unity.IL2CPP"><HintPath>../../refs/bep/BepInEx/core/BepInEx.Unity.IL2CPP.dll</HintPath></Reference>')
          s=s.replace('pkg/HoopLandExtended-0.2.0-alpha.2/payload/','../../pkg/HoopLandExtended-0.2.0-alpha.3/payload/')
          s=s.replace('pkg/HoopLandExtended-0.2.0-alpha.3/payload/','../../pkg/HoopLandExtended-0.2.0-alpha.3/payload/')
          p.write_text(s)
          p=Path("src/Main/HoopLandExpanded/CustomSkills.cs")
          p.write_text(p.read_text().replace("private readonly Random passRandom = new Random();","private readonly System.Random passRandom = new System.Random();"))
          p=Path("src/Main/HoopLandExpanded/SkillLogScope.cs")
          s=p.read_text().replace("Interlocked.Read(in included)","Interlocked.Read(ref included)").replace("Interlocked.Read(in excluded)","Interlocked.Read(ref excluded)").replace("Interlocked.Read(in unresolved)","Interlocked.Read(ref unresolved)").replace("Interlocked.Read(in suppressed)","Interlocked.Read(ref suppressed)")
          p.write_text(s)
          p=Path("src/Main/HoopLandExpanded/SkillIconImages.cs")
          s=p.read_text()
          old='byte* ptr = stackalloc byte[8];\n\t\t// IL cpblk instruction\n\t\tUnsafe.CopyBlock(ptr, ref _003CPrivateImplementationDetails_003E._4C4B6A3BE1314AB86138BEF4314DDE022E600960D8689A2C8F8631802D20DAB6, 8);\n\t\tReadOnlySpan<byte> other = new Span<byte>(ptr, 8);'
          new='ReadOnlySpan<byte> other = new byte[8] { 137, 80, 78, 71, 13, 10, 26, 10 };'
          if old not in s: raise SystemExit("PNG decompile pattern missing")
          p.write_text(s.replace(old,new))
          PY
      - name: Apply complete Breakout baseline
        run: |
          set -euo pipefail
          curl -L --fail -o icon1.patch.zb64 "https://raw.githubusercontent.com/HoopLandExtended/HoopLandExtended-Mod/dbc851b56f0d05e102985116d722a54f522706e8/.github/internal/icon1.patch.zb64"
          python - <<'PY'
          from pathlib import Path
          import base64,zlib
          Path("icon1.patch").write_bytes(zlib.decompress(base64.b64decode(Path("icon1.patch.zb64").read_text().strip())))
          PY
          (cd src/Main && patch --batch -p1 < ../../icon1.patch)
          curl -L --fail -o conceal_icon1.py "https://raw.githubusercontent.com/HoopLandExtended/HoopLandExtended-Mod/1533aef695edcd23e9c8eaf1398b277c25f8a404/.github/internal/conceal_icon1.py"
          python conceal_icon1.py
          curl -L --fail -o headliner.patch.zb64 "https://raw.githubusercontent.com/HoopLandExtended/HoopLandExtended-Mod/1faecaeffd2c2da40c1309690a4f1737637a057d/.github/internal/headliner.patch.zb64"
          python - <<'PY'
          from pathlib import Path
          import base64,zlib
          Path("headliner.patch").write_bytes(zlib.decompress(base64.b64decode(Path("headliner.patch.zb64").read_text().strip())))
          PY
          (cd src/Main && patch --batch -p1 < ../../headliner.patch)
          curl -L --fail -o table-setter.patch.zb64 "https://raw.githubusercontent.com/HoopLandExtended/HoopLandExtended-Mod/a263adaa250dadfb256245adbd3e2f5e15f5652c/.github/internal/table-setter.patch.zb64"
          python - <<'PY'
          from pathlib import Path
          import base64,zlib
          Path("table-setter.patch").write_bytes(zlib.decompress(base64.b64decode(Path("table-setter.patch.zb64").read_text().strip())))
          PY
          (cd src/Main && patch --batch -p1 < ../../table-setter.patch)
          for i in 1 2 3 4; do
            curl -L --fail -o "twf.part$i" "https://raw.githubusercontent.com/HoopLandExtended/HoopLandExtended-Mod/4694085ed02ee454796b8dc4a63c8ed2d7d5474d/.github/internal/twf.part$i"
          done
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,zlib
          hashes=[
            "d117a2e0139e81c9aae07e1dfb9c0defcd679f0e542efc446bdbc6524ebab086",
            "b0026a73a59a0eeca926d12897d7996edfebfd73cb4c7d565f0676dac9f89364",
            "ed78644a70141737d38de069428b12646ecd13f6cc14d10a8a09738a1a7f41cb",
            "77016780c79900a1179f0226e63c0c4062c304e051c9417b3a318f2dad31fb36",
          ]
          parts=[]
          for i,e in enumerate(hashes,1):
            v=Path(f"twf.part{i}").read_text().strip()
            assert len(v)==1550 and hashlib.sha256(v.encode()).hexdigest()==e
            parts.append(v)
          enc="".join(parts)
          assert hashlib.sha256(enc.encode()).hexdigest()=="1a6a2bb6198b3cac6d9adf0a4ff69eba867ce1e2ad91b5de35c2a019939963bf"
          Path("two-way-force.patch").write_bytes(zlib.decompress(base64.b64decode(enc,validate=True)))
          PY
          (cd src/Main && patch --batch -p1 < ../../two-way-force.patch)
          for i in 1 2 3 4 5; do
            curl -L --fail -o "gg.part$i" "https://raw.githubusercontent.com/HoopLandExtended/HoopLandExtended-Mod/11630854919005b8989159093a7f2863d7064a73/.github/internal/gg.part$i"
          done
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,zlib
          lengths=[1500,1500,1500,1500,796]
          hashes=[
            "522b03e14113fee2ca2f572d9e758e550821a55e3efdd4f284b454243f47b2c2",
            "79dbd43b0230ca02b35158158e925f5e44b326666d178fa3c3b19df93fe2410d",
            "545889945b9cd7c88565e61ab57b70f4b2b7cd095ec428f09f00aa8dbdb100b8",
            "793d29ecf3b6eea5bbd8905964efa7bdce082d51d5755071ad3bb40eda0184e0",
            "fce2a0adc286ba8d9dbcc1e74abdb2ba9c63a1ac0a04684b259b7e6dd709ce61",
          ]
          parts=[]
          for i,(n,e) in enumerate(zip(lengths,hashes),1):
            v=Path(f"gg.part{i}").read_text().strip()
            assert len(v)==n and hashlib.sha256(v.encode()).hexdigest()==e
            parts.append(v)
          enc="".join(parts)
          assert hashlib.sha256(enc.encode()).hexdigest()=="f0582b1d63662f514d354c9f126c72c228cfdba9e6984b0a142112c4062d75ab"
          Path("grab-go.patch").write_bytes(zlib.decompress(base64.b64decode(enc,validate=True)))
          PY
          (cd src/Main && patch --batch -p1 < ../../grab-go.patch)
      - name: Apply zero-SP special-slot design
        run: |
          set -euo pipefail
          curl -L --fail -o special-costs.py "https://raw.githubusercontent.com/HoopLandExtended/HoopLandExtended-Mod/62636ebd3ce50a6200e14b80d596f04578ad5490/.github/internal/special-costs.py"
          curl -L --fail -o special-hooks.py "https://raw.githubusercontent.com/HoopLandExtended/HoopLandExtended-Mod/5e0b9e7b77d91390342c5f784dbd841e48493fc3/.github/internal/special-hooks.py"
          curl -L --fail -o special-runtime.py "https://raw.githubusercontent.com/HoopLandExtended/HoopLandExtended-Mod/5e0b9e7b77d91390342c5f784dbd841e48493fc3/.github/internal/special-runtime.py"
          curl -L --fail -o special-ui.py "https://raw.githubusercontent.com/HoopLandExtended/HoopLandExtended-Mod/5e0b9e7b77d91390342c5f784dbd841e48493fc3/.github/internal/special-ui.py"
          python special-costs.py
          python special-hooks.py
          python special-runtime.py
          python special-ui.py

      - name: Apply native skill notification bridge
        run: |
          set -euo pipefail
          curl -L --fail -o skill-notifications.py "https://raw.githubusercontent.com/HoopLandExtended/HoopLandExtended-Mod/a56426e89834f27ebe36a528f3e5855a30f5dcd4/.github/internal/skill-notifications.py"
          python skill-notifications.py

      - name: Apply read-only UI probes
        run: |
          set -euo pipefail
          curl -L --fail -o player-skills-ui-probe.py "https://raw.githubusercontent.com/HoopLandExtended/HoopLandExtended-Mod/1e702327f157251ca19d02f8b977599d740e31bc/.github/internal/player-skills-ui-probe.py"
          python player-skills-ui-probe.py
          python .github/internal/player-upgrades-components-probe.py

      - name: Build Player Upgrades component probe and collector patch
        run: |
          set -euo pipefail
          dotnet build src/Main/HoopLandExpanded.csproj -c Release --nologo
          mkdir -p artifact/Game/BepInEx/plugins/HoopLandExpanded artifact/scripts
          cp src/Main/bin/Release/net6.0/HoopLandExpanded.dll artifact/Game/BepInEx/plugins/HoopLandExpanded/
          cp pkg/HoopLandExtended-0.2.0-alpha.3/scripts/Collect.ps1 artifact/scripts/Collect.ps1
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("artifact/scripts/Collect.ps1")
          s=p.read_text()
          pattern=re.compile(r"(?m)^(\s*)foreach \(\$name in @\([^\r\n]*\)\) \{\r?\n\1    \$file=Join-Path \$session\.FullName \$name\r?\n\1    if \(Test-Path -LiteralPath \$file\) \{ Copy-Item -LiteralPath \$file -Destination \$dest \}\r?\n\1\}")
          def repl(m):
              i=m.group(1)
              return (i+"$diagExts=@('.json','.jsonl','.txt')\n"
                      +i+"foreach ($file in @(Get-ChildItem -LiteralPath $session.FullName -File | Where-Object { $diagExts -contains $_.Extension.ToLowerInvariant() -and $_.Length -le 26214400 })) {\n"
                      +i+"    Copy-Item -LiteralPath $file.FullName -Destination $dest\n"
                      +i+"}")
          s,n=pattern.subn(repl,s,count=1)
          if n!=1:
              raise SystemExit(f"Collect.ps1 diagnostic allowlist anchor mismatch: {n}")
          p.write_text(s)
          PY
          cat > artifact/PROBE-INSTRUCTIONS.txt <<'EOF'
          Player Upgrades component probe

          1. Close Hoop Land.
          2. Extract this ZIP into the root of your current HLE folder, preserving paths.
             It replaces:
               Game\BepInEx\plugins\HoopLandExpanded\HoopLandExpanded.dll
               scripts\Collect.ps1
          3. Launch 2-PLAY-HLE.cmd and choose Continue with HLE if the expected modified-DLL warning appears.
          4. Open Adrian's Player Upgrades screen, then enter Player Skills once.
          5. Back out normally and exit Hoop Land.
          6. Run 4-COLLECT-REPORT.cmd and send the resulting ZIP.

          The runtime probe is read-only. The collector change only broadens collection
          to HLE diagnostic .json/.jsonl/.txt files up to 25 MiB.
          EOF

      - name: Verify UI probe and prior invariants
        run: |
          set -euo pipefail
          grep -q 'Hook("special-equip", "ListSkills", "EquipSkill"' src/Main/HoopLandExpanded/CustomSkills.cs
          grep -q 'Hook("special-cpu", "CPUProgression", "UnlockPlayerSkills"' src/Main/HoopLandExpanded/CustomSkills.cs
          grep -q 'HandleSpecialEquip' src/Main/HoopLandExpanded/CustomSkills.cs
          grep -q 'NormalizeAllSpecialSlots("save-before")' src/Main/HoopLandExpanded/CustomSkills.cs
          grep -q 'NormalizeAllSpecialSlots(source)' src/Main/HoopLandExpanded/CustomSkills.cs
          grep -q 'OrdinarySkillPointsUnaffected = true' src/Main/HoopLandExpanded/CustomSkills.cs
          grep -q 'ICON SLOT: ' src/Main/HoopLandExpanded/CustomSkills.cs
          grep -q 'LEGENDARY SLOT: ' src/Main/HoopLandExpanded/CustomSkills.cs
          ! grep -q 'DisplayText(row, "description", d.Description);' src/Main/HoopLandExpanded/CustomSkills.cs
          grep -q 'HLE_IC01.*Headliner.* 0, 1, 1' src/Main/HoopLandExpanded/CustomSkillCatalog.cs
          grep -q 'HLE_IC02.*Table Setter.* 0, 1, 1' src/Main/HoopLandExpanded/CustomSkillCatalog.cs
          grep -q 'HLE_IC03.*Two-Way Force.* 0, 1, 1' src/Main/HoopLandExpanded/CustomSkillCatalog.cs
          grep -q 'HLE_IC04.*Grab & Go.* 0, 1, 1' src/Main/HoopLandExpanded/CustomSkillCatalog.cs
          grep -q 'HLE_IC05.*March Hero.* 0, 1, 1' src/Main/HoopLandExpanded/CustomSkillCatalog.cs
          grep -q 'HLE_FR05.*Human Torch.* 0, 1, 1' src/Main/HoopLandExpanded/CustomSkillCatalog.cs
          grep -q 'HLE_FR06.*Century.* 0, 1, 1' src/Main/HoopLandExpanded/CustomSkillCatalog.cs
          grep -q 'HLE_FR07.*Total Control.* 0, 1, 1' src/Main/HoopLandExpanded/CustomSkillCatalog.cs
          grep -q 'HLE_LG01.*Maestro.* 0, 1, 1' src/Main/HoopLandExpanded/CustomSkillCatalog.cs
          grep -q 'HLE_LG02.*Unstoppable.* 0, 1, 1' src/Main/HoopLandExpanded/CustomSkillCatalog.cs
          grep -q 'HLE_LG03.*Glass Sovereign.* 0, 1, 1' src/Main/HoopLandExpanded/CustomSkillCatalog.cs
          grep -q 'HLE_LG04.*Defensive Colossus.* 0, 1, 1' src/Main/HoopLandExpanded/CustomSkillCatalog.cs
          grep -q 'HLE_SH01.*Corner Specialist.* 1, 3, 60' src/Main/HoopLandExpanded/CustomSkillCatalog.cs
          grep -q 'HLE_MV06.*Motor.* 2, 3, 150' src/Main/HoopLandExpanded/CustomSkillCatalog.cs
          grep -q 'HLE_EN03.*Second Wind.* 2, 3, 30' src/Main/HoopLandExpanded/CustomSkillCatalog.cs
          grep -q 'IconEquipLimit = 1' src/Main/HoopLandExpanded/SpecialSkillLoadoutRules.cs
          grep -q 'LegendaryEquipLimit = 1' src/Main/HoopLandExpanded/SpecialSkillLoadoutRules.cs
          grep -q 'nativeNotificationReplay' src/Main/HoopLandExpanded/SkillNotificationRuntime.cs
          grep -q 'PlayerSkills.*ProgressSkill' src/Main/HoopLandExpanded/SkillNotificationRuntime.cs
          grep -q 'SkillNotificationsGameReady' src/Main/HoopLandExpanded/CustomSkills.cs
          grep -q 'CareerGameResults.*OnEnable' src/Main/HoopLandExpanded/CustomSkills.cs
          grep -q 'NotifySkillTransition(player, customSkillDefinition' src/Main/HoopLandExpanded/CustomSkills.cs
          grep -q 'NotifySkillTransition(item, customSkillDefinition' src/Main/HoopLandExpanded/CustomSkills.cs
          grep -q 'NotifySkillTransition(player, CustomSkillCatalog.Find(icon.Id)' src/Main/HoopLandExpanded/CustomSkills.cs
          grep -q 'AfterPlayerSkillsUiProbe' src/Main/HoopLandExpanded/CustomSkills.cs
          grep -q 'CapturePlayerSkillsRow' src/Main/HoopLandExpanded/CustomSkills.cs
          grep -q 'player-skills-ui-probe.json' src/Main/HoopLandExpanded/PlayerSkillsUiProbe.cs
          grep -q 'ReadOnly = true' src/Main/HoopLandExpanded/PlayerSkillsUiProbe.cs
          grep -q 'Screen.width' src/Main/HoopLandExpanded/PlayerSkillsUiProbe.cs
          grep -q 'DeclaredMembers = UiDeclaredMemberSnapshot' src/Main/HoopLandExpanded/PlayerSkillsUiProbe.cs
          grep -q 'Hierarchy = UiHierarchy' src/Main/HoopLandExpanded/PlayerSkillsUiProbe.cs
                    grep -q 'CapturePlayerUpgradesUi' src/Main/HoopLandExpanded/PlayerUpgradesUiProbe.cs
          grep -q 'player-upgrades-ui-probe.json' src/Main/HoopLandExpanded/PlayerUpgradesUiProbe.cs
          grep -q 'FoundPlayerUpgrades' src/Main/HoopLandExpanded/PlayerUpgradesUiProbe.cs
          grep -q '\$diagExts' artifact/scripts/Collect.ps1
          grep -q '26214400' artifact/scripts/Collect.ps1
          {
            echo "PASS: 5 ICONs + 7 Legendaries are zero-SP"
            echo "PASS: representative ordinary skill costs unchanged"
            echo "PASS: one ICON slot and one Legendary slot"
            echo "PASS: special-slot runtime, persistence, and presentation hooks present"
            echo "PASS: native HLE unlock/level notification replay bridge present"
            echo "PASS: career-player-only notification gating and duplicate suppression present"
            echo "PASS: read-only Player Skills hierarchy/member/row probe present"
            echo "PASS: read-only Player Upgrades component/event probe present"
            echo "PASS: report collector auto-includes bounded HLE JSON/JSONL/TXT diagnostics"
          } | tee artifact/player-skills-ui-probe-source-checks.txt

      - name: Test notification transition rules
        run: |
          set -euo pipefail
          mkdir -p verify/NotificationSmoke
          cat > verify/NotificationSmoke/NotificationSmoke.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../../src/Main/HoopLandExpanded.csproj" />
            </ItemGroup>
          </Project>
          EOF
          cat > verify/NotificationSmoke/Program.cs <<'EOF'
          using HoopLandExpanded;
          static void Check(bool value,string name){if(!value)throw new Exception("FAIL: "+name);Console.WriteLine("PASS: "+name);}
          Check(SkillNotificationRules.IsRankTransition(0,1),"unlock transition recognized");
          Check(SkillNotificationRules.Kind(0,1)=="unlock","unlock classified");
          Check(SkillNotificationRules.IsRankTransition(1,2),"level transition recognized");
          Check(SkillNotificationRules.Kind(1,2)=="level-up","level-up classified");
          Check(!SkillNotificationRules.IsRankTransition(1,1),"same-rank XP gain suppressed");
          Check(!SkillNotificationRules.IsRankTransition(2,1),"rank regression suppressed");
          Console.WriteLine("ALL SKILL NOTIFICATION RULE TESTS PASSED");
          EOF
          dotnet run --project verify/NotificationSmoke/NotificationSmoke.csproj -c Release --nologo | tee artifact/skill-notification-smoke-test.txt

      - name: Record compatibility
        run: |
          {
            echo "Prototype: read-only Player Upgrades UI probe + Player Skills UI probe + native HLE skill notifications + zero-SP special slots + complete five-ICON Breakout set"
            echo "Ordinary native SP generation unchanged"
            echo "Ordinary native equip path unchanged"
            echo "ICONs: 0 SP, maximum one equipped"
            echo "Legendaries: 0 SP, maximum one equipped"
            echo "Special equip state persists via native SkillXP.equipped"
            echo "Existing earned special ranks remain native SkillXP records"
            echo "Invalid multi-equipped special states reconcile per class"
            echo "CareerHost unchanged from public alpha.3"
            echo "Finance assemblies unchanged from public alpha.3"
            echo "HLE checkpoint schema unchanged"
            echo "No new special-slot save schema"
            echo "HLE custom progression remains authoritative; native ProgressSkill is replayed only for UI notification on proven rank transitions"
            echo "Native replay state is restored immediately after notification"
            echo "Notifications are career-player-only; same-rank XP gains and CPU progression are silent"
            echo "UI probe is read-only and writes player-skills-ui-probe.json to the normal diagnostic session folder"
            echo "Player Skills probe captures ListSkills hierarchy, declared members, visible row state, progress objects, and screen geometry"
            echo "Player Upgrades probe captures sibling hierarchy plus IL2CPP component inventories and native UI event metadata"
            echo "Collector includes HLE diagnostic .json/.jsonl/.txt files up to 25 MiB from the latest sessions"
            sha256sum pkg/HoopLandExtended-0.2.0-alpha.3/payload/HoopLandExpanded.CareerHost.dll
            sha256sum pkg/HoopLandExtended-0.2.0-alpha.3/payload/HoopLandExpanded.Finance.dll
            sha256sum pkg/HoopLandExtended-0.2.0-alpha.3/payload/HoopLandExpanded.Finance.NativeImport.dll
            sha256sum artifact/Game/BepInEx/plugins/HoopLandExpanded/HoopLandExpanded.dll
            sha256sum artifact/scripts/Collect.ps1
          } > artifact/compatibility-invariants.txt

      - uses: actions/upload-artifact@v7
        with:
          name: player-upgrades-components-probe
          path: artifact
          retention-days: 1
