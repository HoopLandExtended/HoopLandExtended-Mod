name: Internal Two-Way Force ICON prototype

on:
  push:
    paths:
      - '.github/workflows/internal-two-way-force-icon.yml'
      - '.github/internal/two-way-force.patch.zb64'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Install ILSpy
        run: dotnet tool install ilspycmd --tool-path .tools

      - name: Recover alpha.3 source and dependencies
        run: |
          set -euo pipefail
          curl -L --fail -o hle.zip "https://github.com/HoopLandExtended/HoopLandExtended-Mod/releases/download/v0.2.0-alpha.3/HoopLandExtended-0.2.0-alpha.3-win-x64.zip"
          unzip -q hle.zip -d pkg
          mkdir -p src/Main
          ./.tools/ilspycmd -p -o src/Main pkg/HoopLandExtended-0.2.0-alpha.3/payload/HoopLandExpanded.dll

          curl -L --fail -o bep.zip "https://builds.bepinex.dev/projects/bepinex_be/788/BepInEx-Unity.IL2CPP-win-x64-6.0.0-be.788%2B5b766a3.zip"
          curl -L --fail -o unity.zip "https://unity.bepinex.dev/libraries/2022.3.62.zip"
          mkdir -p refs/bep refs/unity
          unzip -q bep.zip -d refs/bep
          unzip -q unity.zip -d refs/unity

      - name: Normalize recovered source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("src/Main/HoopLandExpanded.csproj")
          s=p.read_text()
          s=s.replace("<LangVersion>14.0</LangVersion>","<LangVersion>12.0</LangVersion>")
          s=s.replace('<Reference Include="0Harmony" />','<Reference Include="0Harmony"><HintPath>../../refs/bep/BepInEx/core/0Harmony.dll</HintPath></Reference>')
          s=s.replace('<Reference Include="UnityEngine.CoreModule" />','<Reference Include="UnityEngine.CoreModule"><HintPath>../../refs/unity/UnityEngine.CoreModule.dll</HintPath></Reference>')
          s=s.replace('<Reference Include="Il2CppInterop.Runtime" />','<Reference Include="Il2CppInterop.Runtime"><HintPath>../../refs/bep/BepInEx/core/Il2CppInterop.Runtime.dll</HintPath></Reference>')
          s=s.replace('<Reference Include="BepInEx.Core" />','<Reference Include="BepInEx.Core"><HintPath>../../refs/bep/BepInEx/core/BepInEx.Core.dll</HintPath></Reference>')
          s=s.replace('<Reference Include="BepInEx.Unity.IL2CPP" />','<Reference Include="BepInEx.Unity.IL2CPP"><HintPath>../../refs/bep/BepInEx/core/BepInEx.Unity.IL2CPP.dll</HintPath></Reference>')
          s=s.replace('pkg/HoopLandExtended-0.2.0-alpha.2/payload/','../../pkg/HoopLandExtended-0.2.0-alpha.3/payload/')
          s=s.replace('pkg/HoopLandExtended-0.2.0-alpha.3/payload/','../../pkg/HoopLandExtended-0.2.0-alpha.3/payload/')
          p.write_text(s)

          p=Path("src/Main/HoopLandExpanded/CustomSkills.cs")
          p.write_text(p.read_text().replace("private readonly Random passRandom = new Random();","private readonly System.Random passRandom = new System.Random();"))

          p=Path("src/Main/HoopLandExpanded/SkillLogScope.cs")
          s=p.read_text().replace("Interlocked.Read(in included)","Interlocked.Read(ref included)").replace("Interlocked.Read(in excluded)","Interlocked.Read(ref excluded)").replace("Interlocked.Read(in unresolved)","Interlocked.Read(ref unresolved)").replace("Interlocked.Read(in suppressed)","Interlocked.Read(ref suppressed)")
          p.write_text(s)

          p=Path("src/Main/HoopLandExpanded/SkillIconImages.cs")
          s=p.read_text()
          old='byte* ptr = stackalloc byte[8];\n\t\t// IL cpblk instruction\n\t\tUnsafe.CopyBlock(ptr, ref _003CPrivateImplementationDetails_003E._4C4B6A3BE1314AB86138BEF4314DDE022E600960D8689A2C8F8631802D20DAB6, 8);\n\t\tReadOnlySpan<byte> other = new Span<byte>(ptr, 8);'
          new='ReadOnlySpan<byte> other = new byte[8] { 137, 80, 78, 71, 13, 10, 26, 10 };'
          if old not in s:
              raise SystemExit("PNG decompile pattern missing")
          p.write_text(s.replace(old,new))
          PY

      - name: Apply proven Breakout baseline
        run: |
          set -euo pipefail

          curl -L --fail -o icon1.patch.zb64 "https://raw.githubusercontent.com/HoopLandExtended/HoopLandExtended-Mod/dbc851b56f0d05e102985116d722a54f522706e8/.github/internal/icon1.patch.zb64"
          python - <<'PY'
          from pathlib import Path
          import base64,zlib
          Path("icon1.patch").write_bytes(zlib.decompress(base64.b64decode(Path("icon1.patch.zb64").read_text().strip())))
          PY
          (cd src/Main && patch --batch -p1 < ../../icon1.patch)

          curl -L --fail -o conceal_icon1.py "https://raw.githubusercontent.com/HoopLandExtended/HoopLandExtended-Mod/1533aef695edcd23e9c8eaf1398b277c25f8a404/.github/internal/conceal_icon1.py"
          python conceal_icon1.py

          curl -L --fail -o headliner.patch.zb64 "https://raw.githubusercontent.com/HoopLandExtended/HoopLandExtended-Mod/1faecaeffd2c2da40c1309690a4f1737637a057d/.github/internal/headliner.patch.zb64"
          python - <<'PY'
          from pathlib import Path
          import base64,zlib
          Path("headliner.patch").write_bytes(zlib.decompress(base64.b64decode(Path("headliner.patch.zb64").read_text().strip())))
          PY
          (cd src/Main && patch --batch -p1 < ../../headliner.patch)

          curl -L --fail -o table-setter.patch.zb64 "https://raw.githubusercontent.com/HoopLandExtended/HoopLandExtended-Mod/a263adaa250dadfb256245adbd3e2f5e15f5652c/.github/internal/table-setter.patch.zb64"
          python - <<'PY'
          from pathlib import Path
          import base64,zlib
          Path("table-setter.patch").write_bytes(zlib.decompress(base64.b64decode(Path("table-setter.patch.zb64").read_text().strip())))
          PY
          (cd src/Main && patch --batch -p1 < ../../table-setter.patch)

      - name: Apply Two-Way Force
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,zlib
          encoded=Path(".github/internal/two-way-force.patch.zb64").read_text().strip()
          Path("two-way-force.patch").write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          (cd src/Main && patch --batch -p1 < ../../two-way-force.patch)

      - name: Build prototype
        run: |
          set -euo pipefail
          dotnet build src/Main/HoopLandExpanded.csproj -c Release --nologo
          mkdir -p artifact
          cp src/Main/bin/Release/net6.0/HoopLandExpanded.dll artifact/

      - name: Test Two-Way Force and Breakout regressions
        run: |
          set -euo pipefail
          mkdir -p verify/IconSmoke
          cat > verify/IconSmoke/IconSmoke.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <LangVersion>12.0</LangVersion>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../../src/Main/HoopLandExpanded.csproj" />
            </ItemGroup>
          </Project>
          EOF

          cat > verify/IconSmoke/Program.cs <<'EOF'
          using System.Text;
          using HoopLandExpanded;

          static void Check(bool value, string name)
          {
              if (!value) throw new Exception("FAIL: " + name);
              Console.WriteLine("PASS: " + name);
          }

          Check(IconRules.TwoWayForceQualifies(20,30,30.0,30.0,3.0,3.0,0.0,4.0), "Two-Way Force exact PPG plus SPG cutoffs qualify");
          Check(IconRules.TwoWayForceQualifies(20,30,30.0,30.0,0.0,3.0,4.0,4.0), "Two-Way Force BPG route qualifies");
          Check(!IconRules.TwoWayForceQualifies(19,30,30.0,30.0,3.0,3.0,0.0,4.0), "Two-Way Force two-thirds games gate");
          Check(!IconRules.TwoWayForceQualifies(20,30,29.9,30.0,3.0,3.0,4.0,4.0), "Two-Way Force scoring percentile gate");
          Check(!IconRules.TwoWayForceQualifies(20,30,30.0,30.0,2.9,3.0,3.9,4.0), "Two-Way Force defensive percentile gate");

          Check(Math.Abs(IconRules.TwoWayForceSpeed(10f,true)-11f)<0.0001f, "Two-Way Force ten-percent movement");
          Check(Math.Abs(IconRules.TwoWayForceContest(10f,true)-8f)<0.0001f, "Two-Way Force twenty-percent contest reduction");
          Check(Math.Abs(IconRules.TwoWayForceDefense(10f,true)-12f)<0.0001f, "Two-Way Force plus-two defense");

          string College(int phase, int targetGames, int targetPoints, int targetSteals, int targetBlocks)
          {
              var roster = new List<object>();
              roster.Add(new { id=7, league=1, stats=new[]{new{yr=2026,league=1,season=new[]{new{GP=targetGames,PTS=targetPoints,STL=targetSteals,BLK=targetBlocks}}}}, awards=Array.Empty<object>() });
              roster.Add(new { id=8, league=1, stats=new[]{new{yr=2026,league=1,season=new[]{new{GP=30,PTS=750,STL=120,BLK=30}}}}, awards=Array.Empty<object>() });
              roster.Add(new { id=9, league=1, stats=new[]{new{yr=2026,league=1,season=new[]{new{GP=30,PTS=690,STL=80,BLK=120}}}}, awards=Array.Empty<object>() });
              for (int id=10; id<27; id++)
              {
                  int pts=600-(id-10)*3;
                  int stl=45-(id-10);
                  int blk=45-(id-10);
                  roster.Add(new { id, league=1, stats=new[]{new{yr=2026,league=1,season=new[]{new{GP=30,PTS=pts,STL=stl,BLK=blk}}}}, awards=Array.Empty<object>() });
              }
              var payload=new
              {
                  leagueType=1,
                  season=new { currentYear=2026, startingYear=2026, playerId=7, phase },
                  teams=new[]{new{id=10,roster=roster.ToArray()}}
              };
              return System.Text.Json.JsonSerializer.Serialize(payload);
          }

          // 20 qualified players: top 5% = top one scorer; top 10% = top two in each defensive category.
          using (var save=new NativeSkillSave(Encoding.UTF8.GetBytes(College(11,30,900,90,0))))
              Check(save.CollegeTwoWayForcePlayerIds().Contains(7), "native Two-Way Force SPG route qualification");

          using (var save=new NativeSkillSave(Encoding.UTF8.GetBytes(College(11,30,900,0,100))))
              Check(save.CollegeTwoWayForcePlayerIds().Contains(7), "native Two-Way Force BPG route qualification");

          using (var save=new NativeSkillSave(Encoding.UTF8.GetBytes(College(11,19,900,90,0))))
              Check(!save.CollegeTwoWayForcePlayerIds().Contains(7), "native Two-Way Force minimum-games gate");

          using (var save=new NativeSkillSave(Encoding.UTF8.GetBytes(College(11,30,740,90,0))))
              Check(!save.CollegeTwoWayForcePlayerIds().Contains(7), "native Two-Way Force scoring-percentile gate");

          using (var save=new NativeSkillSave(Encoding.UTF8.GetBytes(College(11,30,900,50,20))))
              Check(!save.CollegeTwoWayForcePlayerIds().Contains(7), "native Two-Way Force defense-percentile gate");

          using (var save=new NativeSkillSave(Encoding.UTF8.GetBytes(College(10,30,900,90,0))))
              Check(save.CollegeTwoWayForcePlayerIds().Length==0, "Two-Way Force does not unlock before postseason phase");

          var icon=CustomSkillCatalog.TwoWayForce;
          Check(icon.Id=="HLE_IC03" && icon.Icon && icon.IconFamily=="Breakout" && icon.Cost==3 && icon.MaximumRank==1, "Two-Way Force catalog identity/cost/rank");

          var locked=SkillPresentationPolicy.Resolve(icon,0);
          Check(!locked.Revealed && locked.Label.Contains("ICON"), "locked Two-Way Force classification visible");
          Check(locked.Effect=="Unlock this ICON to reveal its requirements and effects.", "locked Two-Way Force effect concealed");
          Check(string.IsNullOrEmpty(locked.Requirement) && string.IsNullOrEmpty(SkillRequirementPolicy.CatalogRequirement(icon)), "locked Two-Way Force requirement concealed");

          var earned=SkillPresentationPolicy.Resolve(icon,1);
          Check(earned.Revealed && earned.Effect==icon.Description, "earned Two-Way Force effect revealed");
          Check(earned.Requirement.Contains("top 5%",StringComparison.OrdinalIgnoreCase) && earned.Requirement.Contains("top 10%",StringComparison.OrdinalIgnoreCase), "earned Two-Way Force requirement revealed");

          // Prior Breakout regression.
          Check(IconRules.TableSetterQualifies(20,30,10.0,9.333333333,200,500,40), "Table Setter qualification regression");
          Check(Math.Abs(IconRules.TableSetterPass(10f,true)-14f)<0.0001f, "Table Setter pass regression");
          Check(IconRules.HeadlinerQualifies(20,30,40.0,34.0), "Headliner qualification regression");
          Check(Math.Abs(IconRules.HeadlinerSpeed(10f,true)-11.2f)<0.0001f, "Headliner speed regression");
          Check(IconRules.MarchHeroWindow(1,11,2,480,40,8), "March Hero activation regression");
          Check(Math.Abs(IconRules.Contest(10f,true)-8f)<0.0001f, "March Hero contest regression");

          Console.WriteLine("ALL TWO-WAY FORCE ICON TESTS PASSED");
          EOF

          dotnet run --project verify/IconSmoke/IconSmoke.csproj -c Release --nologo | tee artifact/two-way-force-smoke-test.txt

          grep -q 'ArmTwoWayForceOffense' src/Main/HoopLandExpanded/CustomSkills.cs
          grep -q 'ArmTwoWayForceDefense' src/Main/HoopLandExpanded/CustomSkills.cs
          grep -q 'TwoWayForceBlockCredit' src/Main/HoopLandExpanded/CustomSkills.cs
          grep -q 'scope.TwoWayForce' src/Main/HoopLandExpanded/CustomSkills.cs
          grep -q 'TwoWayForceDefenseActive' src/Main/HoopLandExpanded/CustomSkills.cs
          echo "PASS: Two-Way Force live steal/block/make/possession hooks present" | tee -a artifact/two-way-force-smoke-test.txt

      - name: Record compatibility
        run: |
          {
            echo "Prototype: Headliner (HLE_IC01) + Table Setter (HLE_IC02) + Two-Way Force (HLE_IC03) + March Hero (HLE_IC05)"
            echo "CareerHost unchanged from public alpha.3"
            echo "Finance assemblies unchanged from public alpha.3"
            echo "HLE checkpoint schema unchanged"
            echo "Existing alpha.3 HLE careers require no migration"
            echo "Two-Way Force runtime effect is live-game only in this prototype"
            sha256sum pkg/HoopLandExtended-0.2.0-alpha.3/payload/HoopLandExpanded.CareerHost.dll
            sha256sum pkg/HoopLandExtended-0.2.0-alpha.3/payload/HoopLandExpanded.Finance.dll
            sha256sum pkg/HoopLandExtended-0.2.0-alpha.3/payload/HoopLandExpanded.Finance.NativeImport.dll
            sha256sum artifact/HoopLandExpanded.dll
          } > artifact/compatibility-invariants.txt

      - uses: actions/upload-artifact@v7
        with:
          name: two-way-force-icon-prototype
          path: artifact
          retention-days: 1
